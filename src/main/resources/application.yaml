spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD}          # no default on purpose: must come from the environment
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate              # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # set to true once you serve over HTTPS

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true     # makes Swagger UI send the CSRF token on writes

error:
  include-message: never
  include-stacktrace: never

storage:
  directory: ${STORAGE_DIR:./data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health