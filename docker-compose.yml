services:
  db:
    image: postgres:16
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USERNAME:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bound to localhost only, so other machines on your network can't reach the database
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskflow-db-data: